<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTACT — NAMEGEN</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b10; --surface: #0e1318; --border: #1e2a35; --accent: #00e5ff; --text: #e8f0f8; --muted: #4a6070;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: linear-gradient(rgba(0,229,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.02) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none; z-index: 0;
}
.card {
  background: var(--surface); border: 1px solid var(--border); padding: 3rem; max-width: 500px; width: 100%; text-align: center; position: relative; z-index: 10;
}
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 1rem; }
p { font-size: 0.9rem; color: var(--text); margin-bottom: 2rem; line-height: 1.6; }
.btn {
  display: inline-block; font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.15em;
  padding: 0.8rem 2rem; background: var(--accent); color: var(--bg); text-decoration: none; transition: all 0.2s;
}
.btn:hover { box-shadow: 0 0 20px rgba(0,229,255,0.4); transform: translateY(-1px); }
.note { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 1.5rem; }
</style>
<script>
// 2秒後にGoogleフォームへ自動リダイレクト
setTimeout(function(){
  window.location.href = "https://forms.gle/ajTUgHPwJp9qMwGH7";
}, 2000);
</script>
</head>
<body>
<div class="card">
  <div class="logo">REDIRECTING</div>
  <p>お問い合わせフォーム（Google Forms）へ移動しています。<br>画面が切り替わらない場合は、下のボタンをクリックしてください。</p>
  <a href="https://forms.gle/ajTUgHPwJp9qMwGH7" class="btn">OPEN FORM</a>
  <div class="note">// EXTERNAL LINK NETWORK</div>
</div>
</body>
</html>
